<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Operation · สถิติ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <div class="wrap">
    <div class="page-head"><h1>สถิติ</h1><div class="sub">ชม.บินรายคน · ชม.เครื่อง · ข้อขัดข้อง</div></div>

    <h3 style="font-family:'Bai Jamjuree',sans-serif;margin:18px 0 8px">ชั่วโมงบินสะสม — รายคน</h3>
    <div class="tablewrap">
      <table><thead><tr><th>ลูกเรือ</th><th>แบบเครื่อง</th><th style="text-align:end">ชม.รวม</th></tr></thead>
      <tbody id="crew"><tr><td colspan="3" class="empty">กำลังโหลด…</td></tr></tbody></table>
    </div>

    <h3 style="font-family:'Bai Jamjuree',sans-serif;margin:26px 0 8px">ชั่วโมงบินสะสม — รายเครื่อง</h3>
    <div class="tablewrap">
      <table><thead><tr><th>ทะเบียน</th><th>แบบ</th><th style="text-align:end">ชม.รวม</th></tr></thead>
      <tbody id="ac"><tr><td colspan="3" class="empty">กำลังโหลด…</td></tr></tbody></table>
    </div>

    <h3 style="font-family:'Bai Jamjuree',sans-serif;margin:26px 0 8px">ข้อขัดข้อง — รายเครื่อง</h3>
    <div class="tablewrap">
      <table><thead><tr><th>ทะเบียน</th><th>รายละเอียด</th><th>สถานะ</th><th>วันที่</th></tr></thead>
      <tbody id="disc"><tr><td colspan="4" class="empty">กำลังโหลด…</td></tr></tbody></table>
    </div>
  </div>
</main>

<script type="module">
  import { requireAuth } from "./js/auth.js";
  import { renderTopbar } from "./js/ui.js";
  import { supabase } from "./js/supabase.js";

  const profile = await requireAuth();
  if (!profile) throw new Error("no auth");
  renderTopbar(profile);
  const esc=(s)=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

  // ชม.รายคน
  const { data: ch } = await supabase.from("crew_hours")
    .select("total_hours, aircraft_type, profiles(full_name,email)").order("total_hours",{ascending:false});
  document.getElementById("crew").innerHTML = (ch&&ch.length)
    ? ch.map(r=>`<tr><td>${esc(r.profiles?.full_name||r.profiles?.email||"-")}</td><td>${esc(r.aircraft_type)}</td><td class="num">${r.total_hours}</td></tr>`).join("")
    : `<tr><td colspan="3" class="empty">ยังไม่มีข้อมูล</td></tr>`;

  // ชม.เครื่อง
  const { data: ac } = await supabase.from("aircraft").select("*").order("total_hours",{ascending:false});
  document.getElementById("ac").innerHTML = (ac&&ac.length)
    ? ac.map(a=>`<tr><td class="mono">${esc(a.tail_number)}</td><td>${esc(a.type||"-")}</td><td class="num">${a.total_hours}</td></tr>`).join("")
    : `<tr><td colspan="3" class="empty">ยังไม่มีข้อมูล</td></tr>`;

  // ข้อขัดข้อง
  const { data: d } = await supabase.from("discrepancies")
    .select("*, aircraft(tail_number)").order("reported_date",{ascending:false});
  document.getElementById("disc").innerHTML = (d&&d.length)
    ? d.map(x=>`<tr><td class="mono">${esc(x.aircraft?.tail_number||"-")}</td><td>${esc(x.description)}</td><td>${esc(x.status)}</td><td>${esc(x.reported_date)}</td></tr>`).join("")
    : `<tr><td colspan="4" class="empty">ยังไม่มีข้อมูล</td></tr>`;
</script>
</body>
</html>
