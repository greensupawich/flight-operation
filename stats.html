<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Operation · สถิติ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
  main .wrap{max-width:1560px}
  h3.sec{font-family:"Bai Jamjuree",sans-serif;margin:26px 0 8px}
  h3.sec:first-of-type{margin-top:14px}
  .stat-head{display:flex;align-items:end;gap:12px;flex-wrap:wrap}
  .stat-head .pick{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
  .stat-head .pick input{width:auto}
  .kpi{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 4px}
  .kpi .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;box-shadow:var(--shadow)}
  .kpi .card .n{font-family:"Bai Jamjuree",sans-serif;font-weight:700;font-size:22px}
  .kpi .card .l{font-size:12px;color:var(--muted)}

  /* ---- กราฟเส้น ชม.สะสมรายวัน ---- */
  .chart{height:250px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;
         background:var(--surface);box-shadow:var(--shadow);overflow-x:auto}
  .chart svg{display:block;height:230px}
  .chart .ln{fill:none;stroke:var(--primary);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
  .chart .ar{fill:var(--primary);opacity:.12}
  .chart .dot{fill:var(--primary)}
  .chart .grid{stroke:var(--line);stroke-width:1}
  .chart .axt{fill:var(--faint);font-size:10px;font-family:"IBM Plex Mono",monospace}
  .chart-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--faint)}

  /* ---- ตารางแยกประเภท ---- */
  table.mt{border-collapse:collapse;width:100%;font-size:12px}
  table.mt th,table.mt td{border:1px solid var(--line);padding:4px 6px;text-align:center;white-space:nowrap}
  table.mt th{background:var(--surface-2);font-weight:600;font-size:11px;color:var(--muted);position:sticky;top:0}
  table.mt td.k{text-align:start;font-weight:700;white-space:normal;position:sticky;inset-inline-start:0;
                width:92px;min-width:92px;max-width:92px;vertical-align:middle;z-index:1;line-height:1.25}
  table.mt th.k{text-align:start;position:sticky;inset-inline-start:0;width:92px;min-width:92px;z-index:3}
  table.mt td.sub,table.mt th.sub{position:sticky;inset-inline-start:92px;width:44px;min-width:44px;
                background:var(--surface-2);font-size:10px;color:var(--muted);font-weight:600;z-index:1}
  table.mt th.sub{z-index:3}
  table.mt tr.ktop td,table.mt tr.ktop th{border-top:2px solid var(--line-strong)}
  table.mt td.tot,table.mt th.tot{font-weight:700;background:var(--surface-2);position:sticky;inset-inline-end:0}
  table.mt td.z{color:var(--faint)}
  table.mt tr.sum td{font-weight:700;background:var(--surface-2)}
  table.mt tr.sum td.k{background:var(--surface-2)}
  .pager{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0}
  .pager .pinfo{font-size:12.5px;color:var(--muted)}
  .legend{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 0;font-size:12px;color:var(--muted)}
  .legend .sw{display:inline-block;width:14px;height:14px;border-radius:4px;margin-inline-end:5px;vertical-align:-2px;border:1px solid var(--line)}
</style>
</head>
<body>
<main>
  <div class="wrap">
    <div class="page-head stat-head">
      <div><h1>สถิติ</h1><div class="sub">ชม.บินรวม · แยกประเภทภารกิจ · รายคน · รายเครื่อง</div></div>
      <div class="pick">
        <label for="mon" style="margin:0;font-size:13px">เดือน:</label>
        <input type="month" id="mon">
      </div>
    </div>

    <h3 class="sec">ชั่วโมงบินรวมทุกเครื่อง — รายวัน</h3>
    <div class="kpi" id="kpi"></div>
    <div class="chart" id="chart"><div class="chart-empty">กำลังโหลด…</div></div>

    <h3 class="sec">ชั่วโมงบินแยกประเภทภารกิจ — รายวัน / รวมเดือน</h3>
    <div class="tablewrap"><div id="mtable"><div class="empty">กำลังโหลด…</div></div></div>
    <div class="legend" id="legend"></div>

    <h3 class="sec">ชั่วโมงบินสะสม — รายเครื่อง</h3>
    <div class="tablewrap">
      <table><thead><tr><th>ทะเบียน</th><th>แบบ</th><th style="text-align:end">ชม.รวม</th></tr></thead>
      <tbody id="ac"><tr><td colspan="3" class="empty">กำลังโหลด…</td></tr></tbody></table>
    </div>

    <div class="stat-head" style="margin:26px 0 8px">
      <h3 class="sec" style="margin:0">ข้อขัดข้อง — รายเครื่อง</h3>
      <div class="pick"><label for="discAc" style="margin:0;font-size:13px">เครื่อง:</label>
        <select id="discAc" style="width:auto"><option value="">ทั้งหมด</option></select></div>
    </div>
    <div class="tablewrap">
      <table><thead><tr><th>ทะเบียน</th><th>รายละเอียด</th><th>สถานะ</th><th>วันที่</th></tr></thead>
      <tbody id="disc"><tr><td colspan="4" class="empty">กำลังโหลด…</td></tr></tbody></table>
    </div>
    <div class="pager" id="discPager"></div>
  </div>
</main>

<script type="module">
  import { requireAuth } from "./js/auth.js";
  import { renderTopbar } from "./js/ui.js";
  import { supabase } from "./js/supabase.js";
  import { KINDS, KIND_COLORS, DEFAULT_KIND } from "./js/missions.js";

  const profile = await requireAuth();
  if (!profile) throw new Error("no auth");
  renderTopbar(profile);
  const esc=(s)=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const fx=(h)=>Number(h||0);
  const fmt=(h)=>{ const v=Math.round(fx(h)*10)/10; return v ? String(v) : ""; };

  // ---------- ดึงชั่วโมงบินทั้งหมด (ผูกกับวันที่ + ประเภทภารกิจ) ----------
  const { data: reps, error: repErr } = await supabase.from("post_flight_reports")
    .select("total_hours, missions(mission_date, kind)");
  if (repErr) console.warn("reports:", repErr.message);
  const rows = (reps||[]).filter(r=>r.missions && r.missions.mission_date)
    .map(r=>({ date:String(r.missions.mission_date).slice(0,10), kind:r.missions.kind||DEFAULT_KIND, h:fx(r.total_hours) }));

  const daysIn=(y,m)=>new Date(y,m,0).getDate();   // m=1..12

  function renderMonth(ym){
    const [y,m]=ym.split("-").map(Number);
    const nd=daysIn(y,m);
    const inMonth=rows.filter(r=>r.date.slice(0,7)===ym);

    // รวมรายวัน (ทุกประเภท) + แยกตามประเภท (ชม.บิน + จำนวนเที่ยว)
    const perDay=Array(nd+1).fill(0);                 // ชม.รวมต่อวัน (ใช้ในกราฟ)
    const perDayF=Array(nd+1).fill(0);               // จำนวนเที่ยวรวมต่อวัน
    const perKindH=new Map(), perKindF=new Map();    // kind -> [day]=ชม. / =เที่ยว
    for(const r of inMonth){
      const d=Number(r.date.slice(8,10));
      if(d<1||d>nd) continue;
      perDay[d]+=r.h; perDayF[d]+=1;
      if(!perKindH.has(r.kind)){ perKindH.set(r.kind, Array(nd+1).fill(0)); perKindF.set(r.kind, Array(nd+1).fill(0)); }
      perKindH.get(r.kind)[d]+=r.h;
      perKindF.get(r.kind)[d]+=1;
    }
    const monthTotal=perDay.reduce((a,b)=>a+b,0);
    const monthFlights=perDayF.reduce((a,b)=>a+b,0);
    const flyingDays=perDay.filter(v=>v>0).length;
    const maxDay=Math.max(1,...perDay);

    // ----- KPI -----
    document.getElementById("kpi").innerHTML=`
      <div class="card"><div class="n">${Math.round(monthTotal*10)/10}</div><div class="l">ชม.รวมทั้งเดือน</div></div>
      <div class="card"><div class="n">${flyingDays}</div><div class="l">วันที่มีบิน</div></div>
      <div class="card"><div class="n">${inMonth.length}</div><div class="l">เที่ยวบิน</div></div>`;

    // ----- กราฟเส้น ชม.สะสม (รวมเพิ่มขึ้นเรื่อย ๆ ตลอดเดือน) -----
    const chart=document.getElementById("chart");
    if(monthTotal===0){ chart.innerHTML=`<div class="chart-empty">ยังไม่มีข้อมูลชั่วโมงบินในเดือนนี้</div>`; }
    else{
      // เดือนปัจจุบัน → ลากเส้นแค่ถึง "วันนี้" · เดือนที่ผ่านมาแล้ว → เต็มเดือน
      const today=new Date();
      const curYm=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}`;
      const endDay = ym===curYm ? Math.min(today.getDate(),nd) : (ym>curYm ? 0 : nd);
      const cum=Array(nd+1).fill(0);
      for(let d=1;d<=nd;d++) cum[d]=cum[d-1]+perDay[d];
      const yMax=cum[endDay]||1;
      const padL=44,padR=16,padT=12,padB=24,H=230;
      const cw=Math.max(320,(chart.clientWidth||900)-24);
      const minW=padL+padR+Math.max(1,endDay-1)*22;
      const W=Math.max(cw,minW);
      const stepX=(W-padL-padR)/((endDay-1)||1);
      const X=(d)=>padL+stepX*(d-1);
      const Y=(v)=>padT+(H-padT-padB)*(1-v/yMax);
      let grid="";
      for(let i=0;i<=4;i++){ const v=yMax*i/4, yy=Y(v);
        grid+=`<line class="grid" x1="${padL}" y1="${yy.toFixed(1)}" x2="${(W-padR).toFixed(1)}" y2="${yy.toFixed(1)}"/>`
             +`<text class="axt" x="${padL-6}" y="${(yy+3).toFixed(1)}" text-anchor="end">${Math.round(v*10)/10}</text>`; }
      let xl="",dots="";
      for(let d=1;d<=endDay;d++){ if(d===1||d===endDay||d%5===0){
        xl+=`<text class="axt" x="${X(d).toFixed(1)}" y="${H-6}" text-anchor="middle">${d}</text>`;
        dots+=`<circle class="dot" cx="${X(d).toFixed(1)}" cy="${Y(cum[d]).toFixed(1)}" r="3"><title>${d} · สะสม ${Math.round(cum[d]*10)/10} ชม.</title></circle>`; } }
      let ln="";
      for(let d=1;d<=endDay;d++) ln+=(d===1?"M":"L")+X(d).toFixed(1)+","+Y(cum[d]).toFixed(1)+" ";
      const area=`M${X(1).toFixed(1)},${Y(0).toFixed(1)} `
        +Array.from({length:endDay},(_,i)=>`L${X(i+1).toFixed(1)},${Y(cum[i+1]).toFixed(1)}`).join(" ")
        +` L${X(endDay).toFixed(1)},${Y(0).toFixed(1)} Z`;
      chart.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:${W}px">
        ${grid}<path class="ar" d="${area}"/><path class="ln" d="${ln.trim()}"/>${dots}${xl}</svg>`;
    }

    // ----- ตารางแยกประเภท -----
    const kindsShown=Object.keys(KINDS).filter(k=>k!=="stby");   // ทุกประเภท (ยกเว้น STBY) แม้ไม่มีข้อมูล
    const box=document.getElementById("mtable");

    const head=`<tr><th class="k">ประเภทภารกิจ</th><th class="sub"></th>`+
      Array.from({length:nd},(_,i)=>{const d=i+1;const dow=new Date(y,m-1,d).getDay();
        return `<th${(dow===0||dow===6)?' style="color:var(--faint)"':''}>${d}</th>`;}).join("")+
      `<th class="tot">รวมเดือน</th></tr>`;

    const zeros=Array(nd+1).fill(0);
    // แต่ละประเภท = 2 แถวย่อย: บน=จำนวนเที่ยว · ล่าง=ชม.บิน
    const body=kindsShown.map(k=>{
      const c=KIND_COLORS[k]||KIND_COLORS[DEFAULT_KIND];
      const fArr=perKindF.get(k)||zeros, hArr=perKindH.get(k)||zeros;
      const fTot=fArr.reduce((a,b)=>a+b,0), hTot=hArr.reduce((a,b)=>a+b,0);
      const tint=`background:color-mix(in srgb, ${c.bg} 20%, var(--surface))`;
      const fCells=Array.from({length:nd},(_,i)=>{const v=fArr[i+1];
        return v>0?`<td style="${tint}">${v}</td>`:`<td class="z">·</td>`;}).join("");
      const hCells=Array.from({length:nd},(_,i)=>{const v=hArr[i+1];
        return v>0?`<td style="${tint}">${fmt(v)}</td>`:`<td class="z">·</td>`;}).join("");
      return `<tr class="ktop"><td class="k" rowspan="2" style="background:${c.bg};color:${c.fg}">${esc(KINDS[k])}</td>`+
             `<td class="sub">เที่ยว</td>${fCells}<td class="tot">${fTot}</td></tr>`+
             `<tr><td class="sub">ชม.</td>${hCells}<td class="tot">${Math.round(hTot*10)/10}</td></tr>`;
    }).join("");

    const sumF=`<tr class="sum ktop"><td class="k" rowspan="2">รวม/วัน</td><td class="sub">เที่ยว</td>`+
      Array.from({length:nd},(_,i)=>{const v=perDayF[i+1];return `<td>${v>0?v:"·"}</td>`;}).join("")+
      `<td class="tot">${monthFlights}</td></tr>`;
    const sumH=`<tr class="sum"><td class="sub">ชม.</td>`+
      Array.from({length:nd},(_,i)=>{const v=perDay[i+1];return `<td>${v>0?fmt(v):"·"}</td>`;}).join("")+
      `<td class="tot">${Math.round(monthTotal*10)/10}</td></tr>`;

    box.innerHTML=`<table class="mt"><thead>${head}</thead><tbody>${body}${sumF}${sumH}</tbody></table>`;

    document.getElementById("legend").innerHTML=kindsShown.map(k=>{
      const c=KIND_COLORS[k]||KIND_COLORS[DEFAULT_KIND];
      return `<span><i class="sw" style="background:${c.bg}"></i>${esc(KINDS[k])}</span>`;}).join("");
  }

  const mon=document.getElementById("mon");
  const now=new Date();
  mon.value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  mon.addEventListener("change",()=>renderMonth(mon.value||mon.max));
  renderMonth(mon.value);

  // ---------- ตารางสะสม (ไม่ขึ้นกับเดือน) ----------
  const { data: ac } = await supabase.from("aircraft").select("*").order("total_hours",{ascending:false});
  document.getElementById("ac").innerHTML = (ac&&ac.length)
    ? ac.map(a=>`<tr><td class="mono">${esc(a.tail_number)}</td><td>${esc(a.type||"-")}</td><td class="num">${a.total_hours}</td></tr>`).join("")
    : `<tr><td colspan="3" class="empty">ยังไม่มีข้อมูล</td></tr>`;

  const { data: d } = await supabase.from("discrepancies")
    .select("*, aircraft(tail_number)").order("reported_date",{ascending:false});
  // สีประจำเครื่อง (แยกด้วย hue ต่างกัน · ใช้ได้ทั้งธีมสว่าง/มืด ด้วย color-mix)
  const tails=[...new Set((d||[]).map(x=>x.aircraft?.tail_number||"-"))].sort();
  const HUES=[210,8,145,40,275,175,320,95];
  const col=(t)=>`hsl(${HUES[Math.max(0,tails.indexOf(t))%HUES.length]} 70% 45%)`;
  const discRows=(d||[]).slice().sort((a,b)=>
    (a.aircraft?.tail_number||"").localeCompare(b.aircraft?.tail_number||"")
    || String(b.reported_date).localeCompare(String(a.reported_date)));

  // ---- ตัวเลือกเครื่อง (dropdown) ----
  const sel=document.getElementById("discAc");
  const cntOf=(t)=>discRows.filter(x=>(x.aircraft?.tail_number||"-")===t).length;
  sel.innerHTML=`<option value="">ทั้งหมด (${discRows.length})</option>`+
    tails.map(t=>`<option value="${esc(t)}">${esc(t)} (${cntOf(t)})</option>`).join("");

  // ---- แสดงผลแบบแบ่งหน้า หน้าละ 10 ----
  const PAGE=10;
  let discFilter="", discPage=1;
  function renderDisc(){
    const list=discFilter ? discRows.filter(x=>(x.aircraft?.tail_number||"-")===discFilter) : discRows;
    const pages=Math.max(1,Math.ceil(list.length/PAGE));
    if(discPage>pages) discPage=pages;
    const slice=list.slice((discPage-1)*PAGE,(discPage-1)*PAGE+PAGE);
    document.getElementById("disc").innerHTML = slice.length
      ? slice.map(x=>{ const t=x.aircraft?.tail_number||"-"; const c=col(t);
          return `<tr>
            <td class="mono" style="border-inline-start:5px solid ${c};background:color-mix(in srgb, ${c} 20%, var(--surface));font-weight:700">${esc(t)}</td>
            <td>${esc(x.description)}</td><td>${esc(x.status)}</td><td>${esc(x.reported_date)}</td></tr>`;}).join("")
      : `<tr><td colspan="4" class="empty">ไม่มีข้อขัดข้อง</td></tr>`;
    const pager=document.getElementById("discPager");
    if(list.length<=PAGE){ pager.innerHTML=list.length?`<span class="pinfo">${list.length} รายการ</span>`:""; }
    else{
      pager.innerHTML=`<button class="btn sm ghost" ${discPage<=1?"disabled":""} data-prev>‹ ก่อนหน้า</button>`
        +`<span class="pinfo">หน้า ${discPage}/${pages} · ${list.length} รายการ</span>`
        +`<button class="btn sm ghost" ${discPage>=pages?"disabled":""} data-next>ถัดไป ›</button>`;
      pager.querySelector("[data-prev]")?.addEventListener("click",()=>{ discPage--; renderDisc(); });
      pager.querySelector("[data-next]")?.addEventListener("click",()=>{ discPage++; renderDisc(); });
    }
  }
  sel.addEventListener("change",()=>{ discFilter=sel.value; discPage=1; renderDisc(); });
  renderDisc();
</script>
</body>
</html>
