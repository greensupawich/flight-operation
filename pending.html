<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Operation · ลงทะเบียนขอใช้งาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
  .auth-card{max-width:420px}
  .who{font-family:"IBM Plex Mono",monospace;font-size:13px;background:var(--surface-2);
       border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:0 0 6px;color:var(--muted)}
  .who b{color:var(--ink)}
  form{text-align:start}
  .msg{min-height:20px;font-size:13.5px;margin-top:12px;line-height:1.5}
  .msg.ok{color:var(--good)}
  .msg.err{color:var(--crit)}
  .waiting{background:var(--accent-soft);border-radius:10px;padding:16px 18px;color:var(--warn);
           font-size:14px;line-height:1.6;text-align:start}
  .waiting b{display:block;font-size:15px;margin-bottom:4px}
</style>
</head>
<body>
<div class="center-screen">
  <div class="auth-card">
    <div class="logo" id="icon">📝</div>
    <h1 id="title">ลงทะเบียนขอใช้งาน</h1>
    <p id="lead">บัญชีนี้ยังไม่มีสิทธิ์ใช้งาน<br>กรอกข้อมูลแล้วกด "ขอใช้งาน" แอดมินจะพิจารณาอนุมัติ</p>

    <p class="who" id="who"></p>

    <!-- ฟอร์มขอใช้งาน -->
    <form id="reqForm">
      <label>ชื่อ-สกุล</label>
      <input id="f_name" placeholder="เช่น สุภาพร บรรยงค์" autocomplete="name">
      <label>ตำแหน่ง</label>
      <input id="f_position" placeholder="เช่น นักบิน / เจ้าหน้าที่ธุรการ">
      <button class="btn primary" type="submit" id="submitBtn"
              style="width:100%;justify-content:center;margin-top:16px">ขอใช้งาน</button>
    </form>

    <!-- สถานะรออนุมัติ -->
    <div class="waiting" id="waiting" hidden>
      <b>✅ ส่งคำขอแล้ว</b>
      รอแอดมินอนุมัติ เมื่ออนุมัติแล้วให้เข้าสู่ระบบอีกครั้ง (หรือรีเฟรชหน้านี้)
    </div>

    <div class="msg" id="msg"></div>

    <div style="display:flex;gap:8px;justify-content:center;margin-top:18px">
      <button class="btn sm ghost" id="refresh">รีเฟรชสถานะ</button>
      <button class="btn sm ghost" id="out">ออกจากระบบ</button>
    </div>
  </div>
</div>

<script type="module">
  import { supabase } from "./js/supabase.js";
  import { getCurrentProfile, signOut } from "./js/auth.js";

  const profile = await getCurrentProfile();

  // ยังไม่ล็อกอิน / อนุมัติแล้ว → ย้ายหน้า แล้วหยุดทำงานส่วนที่เหลือ
  if (!profile || !profile.email) {
    location.href = "index.html";
  } else if (profile.status === "active") {
    location.href = "home.html";
  } else {
    startRequestPage(profile);
  }

  function startRequestPage(profile) {
  const msg = document.getElementById("msg");
  document.getElementById("who").innerHTML = `บัญชี: <b>${esc(profile.email)}</b>`;

  // ถ้าเคยส่งคำขอแล้ว (มีชื่อในระบบ) → แสดงสถานะรออนุมัติแทนฟอร์ม
  const alreadyRequested = !!(profile.full_name && profile.full_name.trim());
  if (alreadyRequested) showWaiting();
  else {
    document.getElementById("f_name").value = profile.full_name || "";
    document.getElementById("f_position").value = profile.rank || "";
  }

  function showWaiting() {
    document.getElementById("reqForm").hidden = true;
    document.getElementById("waiting").hidden = false;
    document.getElementById("icon").textContent = "⏳";
    document.getElementById("title").textContent = "รออนุมัติ";
    document.getElementById("lead").innerHTML = "คำขอของคุณถูกส่งให้แอดมินแล้ว<br>โปรดรอการอนุมัติ";
  }

  document.getElementById("reqForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("f_name").value.trim();
    const position = document.getElementById("f_position").value.trim();
    if (!name) { msg.className = "msg err"; msg.textContent = "กรุณากรอกชื่อ"; return; }

    const btn = document.getElementById("submitBtn");
    btn.disabled = true; btn.textContent = "กำลังส่งคำขอ…";
    msg.className = "msg"; msg.textContent = "";

    const { error } = await supabase
      .from("profiles")
      .update({ full_name: name, rank: position })
      .eq("id", profile.id);

    btn.disabled = false; btn.textContent = "ขอใช้งาน";
    if (error) { msg.className = "msg err"; msg.textContent = "ส่งคำขอไม่สำเร็จ: " + error.message; return; }
    showWaiting();
  });

  // รีเฟรชสถานะ — เผื่อแอดมินเพิ่งอนุมัติ
  document.getElementById("refresh").addEventListener("click", async () => {
    const p = await getCurrentProfile();
    if (p && p.status === "active") location.href = "home.html";
    else { msg.className = "msg"; msg.textContent = "ยังไม่ได้รับอนุมัติ ลองใหม่อีกครั้งภายหลัง"; }
  });
  document.getElementById("out").addEventListener("click", signOut);
  }  // end startRequestPage

  function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
</script>
</body>
</html>
