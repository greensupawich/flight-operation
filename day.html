<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Operation · ภารกิจประจำวัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
  .day-head{display:flex;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  /* min() กัน grid item กว้างเกินคอนเทนเนอร์ (เหตุที่ตารางตกขอบ) */
  .sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(430px,100%),1fr));gap:20px}
  @media(max-width:900px){ .sheets{grid-template-columns:1fr} }
  .sheet-body{overflow-x:auto}

  /* ---- แจ้งไม่ว่าง ---- */
  .avail{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
         padding:14px 18px;margin-bottom:18px;box-shadow:var(--shadow);display:grid;gap:14px;
         grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
  @media(max-width:760px){ .avail{grid-template-columns:1fr} }
  .avail h3{font-family:"Bai Jamjuree",sans-serif;font-weight:600;font-size:15px;margin:0 0 8px}
  .me-line{font-size:13px;color:var(--muted);margin-bottom:10px}
  .me-line b{color:var(--ink)}
  .off-toggle{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;
              border:1px solid var(--line-strong);background:var(--surface-2);cursor:pointer;font-weight:600}
  .off-toggle input{width:20px;height:20px;accent-color:#C0504D;flex:none}
  .off-toggle.on{background:#F6D5D3;border-color:#C0504D;color:#7A1F1B}
  :root[data-theme="dark"] .off-toggle.on{background:#4A2624;color:#F3C3C0}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .off-toggle.on{background:#4A2624;color:#F3C3C0}}
  .note-row{display:flex;gap:8px;margin-top:8px}
  .note-row input{flex:1}
  .av-msg{font-size:12.5px;min-height:17px;margin-top:6px}
  .av-msg.ok{color:var(--good)} .av-msg.err{color:var(--crit)}
  .off-list{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow:auto}
  .off-item{display:flex;gap:8px;align-items:baseline;font-size:13px;padding:6px 9px;border-radius:7px;
            background:var(--surface-2);border-inline-start:4px solid #C0504D}
  .off-item b{font-weight:600;white-space:nowrap}
  .off-item span{color:var(--muted);font-size:12.5px}          /* ตารางกว้างเกิน → เลื่อนในกรอบตัวเอง */

  /* ---- ฟอร์มภารกิจ (เลียนแบบกระดานจัดบิน) ---- */
  .sheet{background:var(--surface);border:2px solid var(--line-strong);border-radius:8px;overflow:hidden;
         box-shadow:var(--shadow)}
  .sheet-top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface-2);
             border-bottom:2px solid var(--line-strong)}
  /* ชนิดภารกิจ: สีมาจาก KIND_COLORS (inline) — แถบหัวการ์ดทาสีตามชนิดเหมือนกระดาน */
  .sheet-top{border-bottom:2px solid var(--line-strong)}
  .kind{font-size:12px;font-weight:700;letter-spacing:.01em}
  .sheet-top .btn{background:var(--surface);color:var(--ink)}
  .sheet-actions{margin-inline-start:auto;display:flex;gap:6px}

  table.fm{border-collapse:collapse;width:100%;font-size:12.5px;table-layout:fixed}
  table.fm td{border:1px solid var(--line-strong);padding:5px 7px;vertical-align:middle;
              word-break:break-word;line-height:1.45}
  table.fm td.lb{background:var(--surface-2);font-weight:600;text-align:center;color:var(--muted);
                 white-space:nowrap;font-size:11.5px}
  table.fm td.v{font-weight:600;color:var(--ink)}
  table.fm td.c{text-align:center}
  .hot{color:var(--crit);font-weight:700}          /* ตัวเลขสำคัญ: ชพ./PAX/จุดจอด */
  .mono{font-family:"IBM Plex Mono",monospace}
  .crewgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
  .crewgrid span{padding:1px 4px;border-inline-end:1px dashed var(--line);min-height:18px}
  .crewgrid span:last-child{border-inline-end:0}
  .muted-cell{color:var(--faint);font-weight:400}
  /* จอแคบ: ย่อตัวอักษร/ระยะขอบ ให้ตารางพอดีไม่ตกขอบ */
  @media(max-width:520px){
    table.fm{font-size:11px}
    table.fm td{padding:4px 4px}
    table.fm td.lb{font-size:10px}
  }
</style>
</head>
<body>
<main>
  <div class="wrap">
    <div class="page-head day-head">
      <div>
        <h1 id="title">ภารกิจประจำวัน</h1>
        <div class="sub" id="sub"></div>
      </div>
      <div style="margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap">
        <a class="btn sm ghost" href="dashboard.html">← ปฏิทิน</a>
        <button class="btn sm" id="prevDay">วันก่อน</button>
        <button class="btn sm" id="nextDay">วันถัดไป</button>
        <a class="btn sm primary" id="addBtn" href="#" hidden>+ เพิ่มภารกิจ</a>
      </div>
    </div>

    <div class="avail" id="avail" hidden>
      <div id="mePanel"></div>
      <div>
        <h3>นักบินที่ไม่ว่างวันนี้ <span id="offCount" class="muted" style="font-weight:400"></span></h3>
        <div class="off-list" id="offList"></div>
      </div>
    </div>

    <div class="sheets" id="sheets"><div class="empty">กำลังโหลด…</div></div>
  </div>
</main>

<script type="module">
  import { requireAuth, canPlan } from "./js/auth.js";
  import { attachCombo, comboHTML } from "./js/combobox.js";
  import { qualStyle } from "./js/missions.js";
  import { getMyCrewMember, loadUnclaimedCrew, claimCrew, loadUnavailableOn,
           setUnavailable, clearUnavailable } from "./js/availability.js";
  import { renderTopbar } from "./js/ui.js";
  import { loadMissionsByDate, deleteMission, KINDS, DEFAULT_KIND, kindStyle, PILOT_ROLES, OTHER_ROLES, acLabel, esc } from "./js/missions.js";

  const profile = await requireAuth();
  if (profile) {
    renderTopbar(profile);
    const planner = canPlan(profile);

    let date = new URLSearchParams(location.search).get("date");
    if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) {
      const n = new Date();
      date = `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`;
    }

    const TH_MONTH = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
    const TH_DOW = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];

    function shift(days) {
      const [y,m,d] = date.split("-").map(Number);
      const nd = new Date(y, m-1, d + days);
      location.href = `day.html?date=${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,"0")}-${String(nd.getDate()).padStart(2,"0")}`;
    }
    document.getElementById("prevDay").addEventListener("click", ()=>shift(-1));
    document.getElementById("nextDay").addEventListener("click", ()=>shift(1));

    if (planner) {
      const a = document.getElementById("addBtn");
      a.hidden = false; a.href = `mission.html?new=1&date=${date}`;
    }

    // =================================================================
    //  แจ้งไม่ว่างของตัวเอง + รายชื่อคนที่ไม่ว่างวันนี้
    // =================================================================
    async function renderAvailability() {
      const box = document.getElementById("avail");
      box.hidden = false;
      const [me, offs] = await Promise.all([getMyCrewMember(profile.id), loadUnavailableOn(date)]);

      // รายชื่อคนไม่ว่าง
      document.getElementById("offCount").textContent = offs.length ? `(${offs.length})` : "";
      document.getElementById("offList").innerHTML = offs.length
        ? offs.map(o => `<div class="off-item"><b>${esc(o.crew_members?.full_name || "-")}</b>
                         <span>${esc(o.note || "")}</span></div>`).join("")
        : `<div class="muted" style="font-size:13px">ไม่มี</div>`;

      const panel = document.getElementById("mePanel");

      // ยังไม่ได้ผูกบัญชีกับทะเบียนนักบิน → ให้เลือกชื่อตัวเองก่อน
      if (!me) {
        const list = await loadUnclaimedCrew();
        panel.innerHTML = `
          <h3>แจ้งไม่ว่าง</h3>
          <div class="me-line">บัญชีนี้ยังไม่ได้ผูกกับชื่อในทะเบียนนักบิน — เลือกชื่อของคุณ (ทำครั้งเดียว)</div>
          <div class="note-row">
            <div id="claimBox" style="flex:1">${comboHTML("พิมพ์ชื่อหรือรหัส แล้วเลือกจากรายการ")}</div>
            <button class="btn primary" id="claimBtn" style="white-space:nowrap">นี่คือฉัน</button>
          </div>
          <div class="av-msg" id="avMsg">ไม่ใช่นักบิน? ไม่ต้องทำส่วนนี้</div>`;
        let picked = null;
        attachCombo(document.getElementById("claimBox").querySelector(".cb"),
          list.map(c => ({ id: c.id, label: c.full_name, hint: c.code,
                           tag: c.position ? { text: c.position, style: qualStyle(c.position) } : null })),
          { emptyHtml: "ไม่พบชื่อนี้ในทะเบียน (หรือมีคนผูกไปแล้ว) — แจ้ง admin",
            onChange: ({ item }) => { picked = item; } });
        document.getElementById("claimBtn").addEventListener("click", async () => {
          const msg = document.getElementById("avMsg");
          if (!picked) { msg.className = "av-msg err"; msg.textContent = "พิมพ์แล้วเลือกชื่อจากรายการก่อน (ช่องต้องขึ้น ✓ เขียว)"; return; }
          const id = picked.id;
          const name = `${picked.label} (${picked.hint})`;
          if (!confirm(`ยืนยันว่าคุณคือ ${name}?\nเปลี่ยนภายหลังต้องให้ admin แก้`)) return;
          const err = await claimCrew(id);
          if (err) { msg.className = "av-msg err"; msg.textContent = err.message; return; }
          renderAvailability();
        });
        return;
      }

      // ผูกแล้ว → ติ๊กไม่ว่าง + หมายเหตุ
      const mine = offs.find(o => o.crew_member_id === me.id);
      panel.innerHTML = `
        <h3>แจ้งไม่ว่าง</h3>
        <div class="me-line">คุณคือ <b>${esc(me.full_name)}</b> (${esc(me.code)})</div>
        <label class="off-toggle ${mine ? "on" : ""}" id="offLbl">
          <input type="checkbox" id="offChk" ${mine ? "checked" : ""}> ฉันไม่ว่างวันนี้
        </label>
        <div class="note-row">
          <input id="offNote" placeholder="หมายเหตุ เช่น ลาพักผ่อน / ไปราชการ / ตรวจสุขภาพ" value="${esc(mine?.note || "")}">
          <button class="btn" id="noteBtn" style="white-space:nowrap">บันทึกหมายเหตุ</button>
        </div>
        <div class="av-msg" id="avMsg">จะแสดงเป็นช่องสีแดงในหน้าคิวบิน</div>`;

      const chk = document.getElementById("offChk");
      const msg = document.getElementById("avMsg");
      const save = async (checked) => {
        chk.disabled = true;
        const note = document.getElementById("offNote").value;
        const err = checked ? await setUnavailable(me.id, date, note) : await clearUnavailable(me.id, date);
        chk.disabled = false;
        if (err) { msg.className = "av-msg err"; msg.textContent = "บันทึกไม่สำเร็จ: " + err.message; chk.checked = !checked; return; }
        await renderAvailability();
        const m2 = document.getElementById("avMsg");
        m2.className = "av-msg ok";
        m2.textContent = checked ? "บันทึกแล้ว — แสดงเป็นไม่ว่างในหน้าคิวบิน" : "ยกเลิกแล้ว";
      };
      chk.addEventListener("change", () => save(chk.checked));
      document.getElementById("noteBtn").addEventListener("click", () => {
        if (!chk.checked) { chk.checked = true; }   // ใส่หมายเหตุ = แจ้งไม่ว่างด้วย
        save(true);
      });
    }
    renderAvailability();

    const [yy,mm,dd] = date.split("-").map(Number);
    const dObj = new Date(yy, mm-1, dd);
    document.getElementById("title").textContent =
      `วัน${TH_DOW[dObj.getDay()]}ที่ ${dd} ${TH_MONTH[mm-1]} ${yy+543}`;

    // ---------- แถวลูกเรือ ----------
    // ตำแหน่งที่ไม่มีคน → ไม่แสดงแถวเลย
    function crewRow(role, crew) {
      const names = crew.filter(c => (c.position||"").toUpperCase() === role)
                        .sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))
                        .map(c => (c.crew_name || "").trim())
                        .filter(Boolean);
      if (!names.length) return "";
      const slots = Math.max(3, names.length);          // อย่างน้อย 3 ช่องให้ตรงกับกระดาน
      const cells = Array.from({length: slots}, (_, i) => `<span>${esc(names[i] || "")}</span>`).join("");
      return `<tr><td class="lb">${role}</td><td colspan="5" class="v">
                <div class="crewgrid">${cells}</div></td></tr>`;
    }

    function sheet(m) {
      const crew = m.mission_crew || [];
      const ac = m.aircraft ? acLabel(m.aircraft) : "";
      const poc = [m.poc_name, m.poc_phone].filter(Boolean).join("  ");
      const v = (x) => esc(x || "") || `<span class="muted-cell">-</span>`;

      return `
      <div class="sheet" data-id="${m.id}">
        <div class="sheet-top" style="${kindStyle(m.kind)}">
          <span class="kind">${esc(KINDS[m.kind] || KINDS[DEFAULT_KIND])}</span>
          <span style="font-weight:700;font-size:13px">${esc(m.callsign || "-")}</span>
          <div class="sheet-actions">
            ${planner ? `<a class="btn sm" href="mission.html?id=${m.id}">แก้ไข</a>
                         <button class="btn sm" data-del style="color:var(--crit)">ลบ</button>` : ``}
            <a class="btn sm accent" href="report.html?mission=${m.id}">รายงาน</a>
          </div>
        </div>
        <div class="sheet-body">
        <table class="fm">
          <colgroup><col style="width:17%"><col style="width:16%"><col style="width:17%">
                    <col style="width:16%"><col style="width:17%"><col style="width:17%"></colgroup>
          <tr><td class="lb">A/C No.</td><td colspan="2" class="v c mono">${v(ac)}</td>
              <td class="lb">COWBOY</td><td colspan="2" class="v c mono">${v(m.callsign)}</td></tr>
          <tr><td class="lb">SHOWTIME</td><td colspan="2" class="v c mono">${v(m.showtime)}</td>
              <td class="lb">BRIEF</td><td colspan="2" class="v c mono">${v(m.brief_time)}</td></tr>
          <tr><td class="lb">STEP</td><td class="v c mono">${v(m.step_time)}</td>
              <td class="lb">TAXI</td><td class="v c mono">${v(m.taxi_time)}</td>
              <td class="lb">T/O</td><td class="v c mono">${v(m.takeoff_time)}</td></tr>
          <tr><td class="lb">ชพ.</td><td class="v c hot">${v(m.fuel)}</td>
              <td class="lb">จัดรับรอง</td><td class="v c hot">${v(m.catering)}</td>
              <td class="lb">PAX.</td><td class="v c hot">${v(m.pax)}</td></tr>
          <tr><td class="lb">ภารกิจ</td><td colspan="5" class="v c">${v(m.mission_name)}</td></tr>
          <tr><td class="lb">เส้นทางบิน</td><td colspan="5" class="v c">${v(m.route)}</td></tr>
          <tr><td class="lb">หน.คณะ</td><td colspan="5" class="v">${v(m.head_delegation)}</td></tr>
          ${[...PILOT_ROLES, ...OTHER_ROLES].map(r => crewRow(r, crew)).join("")}
          <tr><td class="lb">POCคณะ</td><td colspan="5" class="v">${v(poc)}</td></tr>
          <tr><td class="lb" rowspan="2">หมายเหตุ</td><td colspan="3" rowspan="2" class="v">${v(m.remark)}</td>
              <td class="lb">ไป</td><td class="v c hot">${v(m.parking_out)}</td></tr>
          <tr><td class="lb">กลับ</td><td class="v c hot">${v(m.parking_in)}</td></tr>
        </table>
        </div>
      </div>`;
    }

    async function refresh() {
      const box = document.getElementById("sheets");
      box.innerHTML = `<div class="empty">กำลังโหลด…</div>`;
      const list = await loadMissionsByDate(date);
      document.getElementById("sub").textContent =
        list.length ? `${list.length} ภารกิจ` : "ยังไม่มีภารกิจในวันนี้";
      box.innerHTML = list.length ? list.map(sheet).join("")
        : `<div class="empty">ยังไม่มีภารกิจในวันนี้${planner ? ' · กด "+ เพิ่มภารกิจ" เพื่อสร้าง' : ""}</div>`;

      box.querySelectorAll("[data-del]").forEach((b) =>
        b.addEventListener("click", async (e) => {
          const id = e.target.closest(".sheet").dataset.id;
          if (!confirm("ลบภารกิจนี้? (ลบลูกเรือและรายงานที่ผูกอยู่ด้วย)")) return;
          b.disabled = true;
          const err = await deleteMission(id);
          if (err) { alert("ลบไม่สำเร็จ: " + err.message); b.disabled = false; }
          else refresh();
        }));
    }
    refresh();
  }
</script>
</body>
</html>
