<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Operation · เข้าสู่ระบบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
  .auth-card{max-width:420px}
  .gbtn{width:100%;justify-content:center;font-size:15px;padding:12px;gap:10px;
        background:var(--surface);border:1px solid var(--line-strong);color:var(--ink)}
  .gbtn svg{width:18px;height:18px}
  .divider{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12px;margin:20px 0}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
  .note{margin-top:8px;font-size:13px;color:var(--muted);line-height:1.6}
  .note b{color:var(--ink)}
  .proto-note{margin-top:22px;font-size:11.5px;color:var(--faint);line-height:1.5}
</style>
</head>
<body>
<div class="center-screen">
  <div class="auth-card">
    <div class="logo">🛩️</div>
    <h1>Flight Operation</h1>
    <p>ระบบจัดบินรายวัน</p>

    <button class="btn gbtn" id="googleBtn">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.4 5.4 2.5 13.3l7.9 6.1C12.3 13.2 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.5 3-2.2 5.5-4.7 7.2l7.3 5.7C43.9 37.9 46.5 31.8 46.5 24.5z"/><path fill="#FBBC05" d="M10.4 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.5 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.4 0 11.9-2.1 15.9-5.8l-7.3-5.7c-2 1.4-4.7 2.3-8.6 2.3-6.3 0-11.7-3.7-13.6-9.9l-7.9 6.1C6.4 42.6 14.6 48 24 48z"/></svg>
      <span id="btnLabel">ลงชื่อเข้าใช้ด้วย Google</span>
    </button>

    <div class="divider">ยังไม่มีบัญชี?</div>
    <p class="note">
      <b>ลงทะเบียนขอใช้งาน:</b> กดปุ่ม "ลงชื่อเข้าใช้ด้วย Google" ด้านบนด้วยบัญชี Gmail ของคุณ
      แล้วกรอก <b>ชื่อ + ตำแหน่ง</b> เพื่อส่งคำขอ — แอดมินจะพิจารณาอนุมัติและกำหนดสิทธิ์ให้
    </p>
    <p class="proto-note">🔒 เข้าสู่ระบบด้วยบัญชี Google · ข้อมูลเก็บบน Supabase (cloud)</p>
  </div>
</div>

<script type="module">
  import { supabase } from "./js/supabase.js";
  import { signInWithGoogle } from "./js/auth.js";

  // ถ้ามี session อยู่แล้ว → ไปหน้าหลัก
  const { data:{ session } } = await supabase.auth.getSession();
  if (session) location.href = "home.html";

  const btn = document.getElementById("googleBtn");
  btn.addEventListener("click", async () => {
    document.getElementById("btnLabel").textContent = "กำลังพาไป Google…";
    btn.disabled = true;
    await signInWithGoogle();
  });
</script>
</body>
</html>
